services:
  postgres:
    image: postgres:latest
    container_name: postgres_docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_v18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10


  redis:
    image: redis:latest
    container_name: redis_caching_docker
    expose:
      - "6379"

  backend:
    build: .
    image: payment-app:latest
    container_name: payment_backend_docker
    env_file:
      - .env
    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/admin_ui:/usr/share/nginx/html:ro

    depends_on:
      - backend

  worker:
    image: payment-app:latest
    pull_policy: never
    container_name: payment_worker_docker
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_v18_data: